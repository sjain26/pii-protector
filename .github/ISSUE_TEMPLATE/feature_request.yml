name: 💡 Feature request
description: Suggest a new feature, a new PII type, or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea! Tell us what you'd like `pii-protector` to do."

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues/discussions and this hasn't been requested yet
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New PII type / pattern (e.g. a new country's ID)
        - Improve detection accuracy
        - New API / output option
        - Performance
        - Integration (framework, language binding, etc.)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
      placeholder: "When processing ... I need ... because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include an example if you can.
    validations:
      required: true

  - type: input
    id: pii-example
    attributes:
      label: Example value (if requesting a new PII type — use a FAKE sample)
      placeholder: "e.g. UK National Insurance number: QQ 12 34 56 C"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today.
    validations:
      required: false
